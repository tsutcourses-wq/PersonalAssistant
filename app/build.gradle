plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personalassistant.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personalassistant.mobile'
        minSdk 23
        targetSdk 35
        versionCode 4000
        versionName '4.0.0-android'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
